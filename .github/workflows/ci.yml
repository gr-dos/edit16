name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # make fetches the pinned FPC i8086-msdos cross-compiler
      # (scripts/fetch-fpc8086); the archive is cached per pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fpc8086.tar.xz
          key: fpc8086-${{ hashFiles('scripts/fetch-fpc8086') }}

      - name: Install DOSBox-X and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x zip

      - name: Build
        run: make

      # fv/editors.pas is FPC 3.2.2's file plus fv/editors.diff
      - name: Check the patched FreeVision unit
        run: make check-fv

      - name: Test
        run: make test

      - name: Archive
        run: make dist
